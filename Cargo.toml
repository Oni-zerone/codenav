[package]
name = "codenav"
version = "0.1.0"
edition = "2024"
description = "Index a repository into a code graph and let LLMs explore it over MCP"

[workspace]
members = [".", "wasm"]

# The library holds the graph format (always) and, with `indexer`, everything that builds
# and serves graphs. Without it, it compiles to WebAssembly: the VS Code extension reads
# `graph.cnav` with this same code (see `wasm/`).
[features]
default = ["indexer"]
indexer = [
    "dep:clap",
    "dep:ignore",
    "dep:rayon",
    "dep:tree-sitter",
    "dep:tree-sitter-go",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-typescript",
]

[[bin]]
name = "codenav"
path = "src/main.rs"
required-features = ["indexer"]

[dependencies]
anyhow = "1.0.104"
bincode = "1.3.3"
clap = { version = "4.6.7", features = ["derive"], optional = true }
ignore = { version = "0.4.34", optional = true }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[profile.release]
lto = "thin"
